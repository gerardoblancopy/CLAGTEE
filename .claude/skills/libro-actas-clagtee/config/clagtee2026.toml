[prefacio]
titulo = "Preface"
texto = """
Located at the south extreme of South America, Chile is bordered by Argentina on the east, Peru by the north and Bolivia by the northeast. Santiago, the capital city, is located in the central zone. In Santiago will take place the 16th Latin-American Congress on Electricity Generation and Transmission (October 28th - 30th, 2026), recognized as a very important event by the community of power systems science and engineering in Latin-American countries. This congress is preceded by the 15th Latin-American Congress on Electricity Generation and Transmission, organized by the Universidad Nacional de Mar del Plata, that took place in Mar del Plata, Argentina, in November 2024.

This international event has been created with the purpose of contributing with a valuable instance for sharing knowledge and experiences concerned with the operation, planning and technological developments in generation, transmission and distribution of electrical systems.

The XVI CLAGTEE program includes the discussion of technical papers prepared by professionals and researchers (previously subject to the acceptance of a Review Committee), keynote lectures and panels presented by experts from industry and academia, and a pre-congress workshop on Artificial Intelligence applied to power systems. This edition is technically co-sponsored by the IEEE Chile Section. The topics covered include Power System Planning, Operation and Reliability; Renewable Energy Integration, DER and Storage; Power Electronics and Energy Conversion; Sensors, Metrology and Advanced Monitoring; Telecommunications, Digital Networks and Cybersecurity; Data Science, AI and Advanced Computing; Electricity Markets, Economics, Regulation and Energy Transition; Electrical Machines, Drives and Actuators; Conventional and Alternative Power Plants; Bioenergy and Hydrogen; and Social, Economic and Environmental Issues.

We welcome all of you, in particular those coming from abroad, and we hope that these days in Santiago will be very fruitful.
"""
firma_nombre = "Jorge Mendoza Baeza"
firma_cargo = "Executive Chairman"

[informacion]
# Página vii.
fecha = "October 28-30, 2026."
lugar = "MR. Hotel (former Hotel Neruda), Providencia, Santiago de Chile"
web = "www.clagtee2026.org"
contacto = [
