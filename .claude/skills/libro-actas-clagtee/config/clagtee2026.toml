# Configuración del Libro de Resúmenes (Book of Abstracts) — XVI CLAGTEE 2026
#
# Este archivo controla TODO el contenido fijo del libro (portada, páginas
# preliminares, comités, tracks). Los resúmenes salen del export del CMS.
#
# Convenciones:
#   - Los textos van en inglés, como el libro 2019.
#   - Un valor que empieza con "TODO" se imprime resaltado en rojo en el PDF
#     y el script lo informa como pendiente: hay que completarlo antes de la
#     versión final.
#   - Las rutas de imágenes son relativas a la raíz del repositorio.
#   - Los párrafos de textos largos se separan con una línea en blanco.

[libro]
titulo = "BOOK OF ABSTRACTS"
nombre_corto = "CLAGTEE 2026"
edicion_romana = "XVI"
nombre_congreso = "Latin-American Congress on Electricity Generation and Transmission"
# Línea pequeña de la cabecera de las páginas de resúmenes (7 pt).
titulo_corrido = "XVI Latin-American Congress on Electricity Generation and Transmission"
# Pie de página de las páginas de resúmenes: "• PUCV 2026 •".
pie = "PUCV 2026"
fechas_portada = "October 28th - 30th, 2026"
ciudad_portada = "Santiago de Chile"
web = "www.clagtee2026.org"
idioma = "en"
# Formato del ID que se agrega al final de cada título: {id} = ID del CMS.
formato_id = "(ID {id})"
# Palabra que une los dos últimos autores ("A, B and C").
conector_autores = "and"

[portada]
# Dos líneas bajo "CLAGTEE 2026", cortadas como en 2019.
subtitulo = [
  "XVI Latin-American Congress on Electricity",
  "Generation and Transmission",
]
# Logo blanco de la Escuela + PUCV sobre la diagonal morada superior.
logo_superior = ".claude/skills/libro-actas-clagtee/assets/logos/pucv-eie-blanco.png"
# Torre del logo CLAGTEE (es la misma marca en 2019 y 2026).
torre = ".claude/skills/libro-actas-clagtee/assets/logos/torre-clagtee.png"
# Fila de logos institucionales al pie de la portada (izq., centro, der.).
logos_inferiores = [
  ".claude/skills/libro-actas-clagtee/assets/logos/pucv-color.png",
  ".claude/skills/libro-actas-clagtee/assets/logos/unesp.png",
  ".claude/skills/libro-actas-clagtee/assets/logos/unmdp.png",
]

[colores]
morado = "#361e59"        # fondo diagonal de portada y triángulos
morado_claro = "#462768"  # decoraciones (grilla de puntos, franjas)
morado_texto = "#2f2364"  # "CLAGTEE 2026"
azul_oscuro = "#2b367d"   # subtítulo del congreso en portada
azul = "#355c9d"          # "BOOK OF ABSTRACTS", "Sponsors", ciudad
morado_fecha = "#482c7a"  # fechas de portada
gris = "#818181"          # URL de portada

[fuentes]
# Se usa la primera fuente instalada de cada lista. Las del libro 2019 eran
# Nirmala UI, Minion Pro y Modernica (comerciales); si no están instaladas se
# usan los equivalentes libres incluidos en assets/fonts.
sans = ["Nirmala UI", "Open Sans"]
serif = ["Minion Pro", "Crimson Text"]
display = ["Modernica", "Montserrat"]
# Factor de cuerpo para la fuente libre, de modo que el texto ocupe el mismo
# ancho que con la original (medido sobre el PDF 2019). Solo se aplica si la
# primera fuente de la lista no está instalada.
escala_sustituta = { sans = 0.945, serif = 1.03, display = 0.79 }

[patrocinadores]
titulo = "Sponsors"
# Logos en orden de aparición (página iii y contraportada). Alto en pt.
logos = [
  { archivo = "public/sponsors/hendrix-marmon-dark.png", alto = 34 },
  { archivo = "public/sponsors/colegio-de-ingenieros.png", alto = 46 },
]

