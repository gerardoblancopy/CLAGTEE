]

[objetivo]
titulo = "Objective"
texto = """
The growing demand for electric energy in the Latin-American countries requires a greater quality of service and efficiency in the area of techno-economic operation. This brings a constant need for improvement in the growth planning at all levels of operation of the electric energy systems. The economic and technical aspects must be taken into consideration, as well as the environmental impact of implantation of new power plants and the need to introduce new technologies, control systems and safety measures.

Gradually a process of integration among the Latin-American countries has emerged, as the electric energy needs are similar, including the generation facilities, for these countries.
"""

[historia]
titulo = "History of the congress"
texto = """
Considering the above mentioned points, UNESP - Universidade Estadual Paulista (Brazil), PUCV - Pontificia Universidad Católica de Valparaíso (Chile) and UNMDP - Universidad Nacional de Mar del Plata (Argentina) have joined forces in order to create a forum that permits a valuable exchange of experiences concerning the methodology for the analysis of operation, planning, and the introduction of new technologies that could contribute to the improvement of the electric energy generation and transmission systems. This has become a reality with the creation of these Latin-American congresses, which take place in the distinct cities of the Latin-American countries.
"""
ediciones = [
  "The I Congress took place on October, 1993 in Viña del Mar, Chile.",
  "The II Congress took place on November, 1995 in Mar del Plata, Argentina.",
  "The III Congress took place on November, 1997 in Campos do Jordão, in the state of São Paulo, Brazil.",
  "The IV Congress took place on November, 2000 in Viña del Mar, Chile.",
  "The V Congress took place on November, 2003 in São Pedro City, State of São Paulo, Brazil.",
  "The VI Congress was held in Mar del Plata City, Argentina, November 13 to November 17, 2005.",
  "The VII Congress took place in Valparaíso City, Chile, October 22 to October 25, 2007.",
  "The VIII Congress was held in Ubatuba, SP Brazil, October 18 to October 22, 2009.",
  "The IX Congress was held in Mar del Plata City, Argentina, November 06 to November 09, 2011.",
  "The X Congress was held in Viña del Mar, Chile, October 06 to October 09, 2013.",
  "The XI Congress was held in São José dos Campos, Brazil, November 08 to November 11, 2015.",
  "The XII Congress was held in Mar del Plata City, Argentina, November 12 to November 15, 2017.",
  "The XIII Congress was held in Santiago, Chile, October 20 to October 23, 2019.",
  "The XIV Congress was held in Rio de Janeiro, Brazil, November, 2022.",
  "The XV Congress was held in Mar del Plata, Argentina, November, 2024.",
  "The XVI Congress will be in Santiago, Chile, October 28 to October 30, 2026.",
]

